version: '3.8'

services:
  vector_db:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API
    volumes:
      - ./qdrant_data:/qdrant/storage
    networks:
      - poc_network

  inference_api:
    build: ./inference
    command: python -u main.py
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    volumes:
      - ./inference:/app
    networks:
      - poc_network



    # Exposes POST http://localhost:8000/embed

networks:
  poc_network:
    driver: bridge
